name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          "assemblyVersion=$version.0" >> $env:GITHUB_OUTPUT

      - name: Embed version into AssemblyInfo
        shell: pwsh
        run: |
          $path = "flapping_penguin/Properties/AssemblyInfo.cs"
          $content = Get-Content $path -Raw
          $content = $content -replace 'AssemblyVersion\("[^"]+"\)', 'AssemblyVersion("${{ steps.version.outputs.assemblyVersion }}")'
          $content = $content -replace 'AssemblyFileVersion\("[^"]+"\)', 'AssemblyFileVersion("${{ steps.version.outputs.assemblyVersion }}")'
          Set-Content -Path $path -Value $content -NoNewline

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore flapping_penguin/flapping_penguin.csproj -SolutionDirectory .

      - name: Build (Release)
        run: msbuild flapping_penguin/flapping_penguin.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/flapping_penguin.iss
          options: /DMyAppVersion=${{ steps.version.outputs.version }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/flapping_penguin-setup.exe
          generate_release_notes: true
          draft: false
